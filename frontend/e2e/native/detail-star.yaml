appId: cz.janbambas.ba
name: an artist can be starred from the detail sheet
---
- runFlow: common/launch-fresh.yaml
# Search opens the sheet (common/search-artist.yaml).
- runFlow:
    file: common/search-artist.yaml
    env: { QUERY: "exorcizphobia" }
# A result's label carries the day, time and stage too, so an exact match on
# the bare name is the sheet's title. It is only visible if the sheet exposes its content
# rather than being one opaque "Bottom Sheet" element.
- assertVisible: "EXORCIZPHOBIA"
- tapOn: { text: "Toggle interest", rightOf: "EXORCIZPHOBIA" }
- assertVisible: "Maybe"
