appId: cz.janbambas.ba
name: the timeline shows lanes and survives a day switch
---
- runFlow: common/launch-fresh.yaml
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Program" }
- extendedWaitUntil:
    visible: ".*Marshall.*"
    timeout: 20000
- tapOn: "THU.*"
- assertVisible: ".*Marshall.*"
- tapOn: "WED.*"
- assertVisible: ".*Marshall.*"
