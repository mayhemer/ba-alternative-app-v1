appId: cz.janbambas.ba
name: switching day changes the timeline's lanes
---
# Lanes per day come from the ba2025 capture: the warm-up Tuesday has only the
# "Obscure" stage, and "Marshall" opens on Wednesday. So the day switch is
# proven by content changing, not merely by nothing crashing.
- runFlow: common/launch-fresh.yaml
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Program" }
- extendedWaitUntil:
    visible: ".*Obscure.*"
    timeout: 20000
- assertNotVisible: ".*Marshall.*"
# Day buttons render uppercase and merge with their date: "WED, 6.8.".
- tapOn: "WED.*"
- extendedWaitUntil:
    visible: ".*Marshall.*"
    timeout: 20000
- tapOn: "THU.*"
- assertVisible: ".*Marshall.*"
