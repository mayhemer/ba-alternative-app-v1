appId: cz.janbambas.ba
name: two clashing must-sees show up as a conflict in My plan
---
- runFlow: common/launch-fresh.yaml
# EXORCIZPHOBIA and CRYSTAL LAKE overlap on Wednesday in the ba2025 capture.
# Two presses each = "must see"; only must-sees count as conflicts. Each is
# found by search and starred in its sheet (common/must-see.yaml).
- runFlow:
    file: common/must-see.yaml
    env: { QUERY: "exorcizphobia" }
- runFlow:
    file: common/must-see.yaml
    env: { QUERY: "crystal lake" }
# With conflicts the drawer entry carries a warning sign and the count.
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "My plan, 2 conflicts" }
# The simulator's clock is not inside the 2025 festival, so the plan opens on
# another day: pick Wednesday from the day switcher.
# The day buttons read "WED, 6.8.": the weekday is shown in capitals.
- tapOn: "WED.*"
- assertVisible: ".*EXORCIZPHOBIA.*"
- assertVisible: ".*CRYSTAL LAKE.*"
- assertVisible: "Conflict"
# Only conflicts: the clashing pair stays. The filter button closes the panel itself.
- tapOn: "Filters"
- tapOn: "Only conflicts"
- assertVisible: ".*EXORCIZPHOBIA.*"
- assertVisible: ".*CRYSTAL LAKE.*"
