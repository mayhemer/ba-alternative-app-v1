# Closes the artist sheet a search result opened, then the search under it
# (its ✕: the first clears the typed field, the second closes), back to the
# screen as it was. Clearing gives the field the keyboard, and the field rises
# onto it: the second ✕ is tapped once it has settled, by its id, as the
# dimmed screen behind an empty field is labelled "Close search" too. The
# sheet opens expanded, up to the safe area, so there is no backdrop to tap: it
# is swiped down by its handle and header, which drag the sheet as the handle
# does.
appId: cz.janbambas.ba
---
- swipe:
    start: "50%,12%"
    end: "50%,95%"
- waitForAnimationToEnd
- tapOn: "Clear search"
- waitForAnimationToEnd
- tapOn: { id: "search-close" }
- waitForAnimationToEnd
