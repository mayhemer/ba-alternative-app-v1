# Marks ${QUERY} a must-see from the artist list: two star presses. The search
# narrows the list to one row, so its star is element 0.
appId: cz.janbambas.ba
---
- runFlow:
    file: search-artist.yaml
    env: { QUERY: "${QUERY}" }
# The star selector opens beside the star and leaves it uncovered.
- tapOn: { text: "Toggle interest", index: 0 }
- tapOn: { text: "Toggle interest", index: 0 }
# The star selector covers part of the row (or of the sheet's header), and a
# touch on it is its own, until it closes by itself 2.5 s after the last tap.
- extendedWaitUntil:
    notVisible:
      id: "star-selector"
    timeout: 5000
