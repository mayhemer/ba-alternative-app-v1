appId: cz.janbambas.ba
name: under My picks the Support Program keeps every set but my don't-gos
---
# The simulator's clock is outside the 2025 festival, so the Support Program
# opens on its first day, the warm-up Tuesday. From 13:00 it has KUNDY CREW and
# ART-BRUT-ALL (the exhibitions, both until 01:00) and PIT OF DOOM, all on
# screen where the day opens (12:45).
#
# Under My picks the timeline keeps the sets I haven't picked, muted (which
# Maestro can't see), and removes only my own "don't go" sets: that removal is
# what proves the lens on this timeline, not just on the list.
- runFlow: common/launch-fresh.yaml
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Support Program" }

# KUNDY CREW: one press = "maybe", a pick.
- tapOn: ".*KUNDY CREW.*"
- waitForAnimationToEnd
# The sheet's title is the bare name.
- tapOn: { text: "Toggle interest", rightOf: "KUNDY CREW" }
- assertVisible: "Maybe"
- runFlow: common/close-sheet-after-star.yaml

# PIT OF DOOM: one press opens the star selector, where "Don't go" is chosen.
- tapOn: ".*PIT OF DOOM.*"
- waitForAnimationToEnd
- tapOn: { text: "Toggle interest", rightOf: "PIT OF DOOM" }
- tapOn: "Don't go"
- runFlow: common/close-sheet-after-star.yaml

- tapOn: "View and share schedules"
- tapOn: ".*My picks.*"
- waitForAnimationToEnd
# The pick, and a set I haven't picked, both stay; my "don't go" is gone.
- assertVisible: ".*KUNDY CREW.*"
- assertVisible: ".*ART-BRUT-ALL.*"
- assertNotVisible: ".*PIT OF DOOM.*"
