# A2 · Every section opens from the drawer, and the Program switches day.
#
# Native only: the drawer and stack navigators, and the native timeline drawing
# another day's lanes.
#
# The header shows the festival logo, not a screen title, so each section is
# recognised by content only it has. Outside the festival the timelines open on
# the first festival day, the warm-up Tuesday: the Program has a single lane,
# "Obscure", and "Marshall" opens on Wednesday; the Support Program's
# "Exhibition" lane exists nowhere else.
appId: cz.janbambas.ba
---
- runFlow: common/relaunch.yaml
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Program" }
- extendedWaitUntil:
    visible: ".*Obscure.*"
    timeout: 20000
- assertNotVisible: ".*Marshall.*"
# Day buttons render uppercase and merge with their date: "WED, 6.8.".
- tapOn: "WED.*"
- extendedWaitUntil:
    visible: ".*Marshall.*"
    timeout: 20000
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Support Program" }
- extendedWaitUntil:
    visible: ".*Exhibition.*"
    timeout: 20000
# My plan with nothing picked: the shown day is empty.
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "My plan" }
- assertVisible: "Nothing planned for this day"
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Settings" }
# The edition dropdown's field is labelled "Festival edition, BA2025" — asserting
# that exact label also proves the e2e build started on the edition its fixtures cover.
- assertVisible: "Festival edition, BA2025"
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Artists" }
- assertVisible: ".*3 INCHES OF BLOOD.*"
