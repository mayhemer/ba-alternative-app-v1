# C2 · Switching the edition reloads the lineup.
#
# Native only: the native dropdown, then the startup gate run again for the new
# edition, its fetch and the native list.
appId: cz.janbambas.ba
---
- runFlow: common/relaunch.yaml
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Settings" }
# The editions are a dropdown: open it, then pick.
- tapOn: "Festival edition, .*"
- tapOn: "BA2024"
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Artists" }
# Each name exists in only one edition's lineup.
- extendedWaitUntil:
    visible: ".*1914.*"
    timeout: 30000
- assertNotVisible: ".*3 INCHES OF BLOOD.*"
