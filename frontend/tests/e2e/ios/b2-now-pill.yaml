# B2 · The now pill always opens My plan on today, scrolled to now: from a
# timeline, and again from My plan itself, which it never leaves.
#
# Native only: both landings scroll the native list. Every case of the rule is
# web's (tests/e2e/web/plan.spec.ts); spec: docs/frontend/design/my-plan.md ›
# Top bar.
#
# At Wednesday 14:10 the pill names CRYSTAL LAKE, live on the Sea Shepherd
# stage. A plan row's label is "name, time, stage", a timeline block's
# "name, time" — the stage after it tells them apart.
appId: cz.janbambas.ba
---
- runFlow: common/relaunch-returning-user.yaml
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Program" }
- extendedWaitUntil:
    visible: ".*Marshall.*"
    timeout: 20000
# From a timeline: My plan, today, scrolled to now.
- tapOn: { id: "now-pill" }
- extendedWaitUntil:
    visible: { id: "plan-now-arrow" }
    timeout: 10000
- assertVisible: "CRYSTAL LAKE, 14:00–14:40, Sea Shepherd"
# From My plan with now in view: still My plan at now (a plan row, with its stage).
- tapOn: { id: "now-pill" }
- extendedWaitUntil:
    visible: { id: "plan-now-arrow" }
    timeout: 10000
- assertVisible: "CRYSTAL LAKE, 14:00–14:40, Sea Shepherd"
