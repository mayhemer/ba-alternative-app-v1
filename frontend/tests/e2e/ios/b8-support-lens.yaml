# B8 · Under My picks the Support Program shows only my picks.
#
# Native only: the native timeline's lanes drawn again under another lens. The
# lens rule is Jest's (screens/timeline/*.test.ts*) and web's
# (tests/e2e/web/timeline.spec.ts).
#
# The seed made KUNDY CREW a Maybe and PIT OF DOOM a don't go. On the warm-up
# Tuesday, from 13:00, the Support Program has KUNDY CREW and ART-BRUT-ALL (the
# exhibitions, both until 01:00) and PIT OF DOOM, all on screen where the day
# opens (12:45). Under My picks the timeline shows only my picks: the set I
# haven't picked and my "don't go" are both gone, which proves the lens on this
# timeline.
appId: cz.janbambas.ba
---
- runFlow: common/relaunch.yaml
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Support Program" }
# B2 left another day selected.
- tapOn: "TUE.*"
- extendedWaitUntil:
    visible: ".*PIT OF DOOM.*"
    timeout: 20000
- tapOn: "View and share schedules"
- tapOn: ".*My picks.*"
- waitForAnimationToEnd
# The pick stays; a set I haven't picked and my "don't go" are gone.
- assertVisible: ".*KUNDY CREW.*"
- assertNotVisible: ".*ART-BRUT-ALL.*"
- assertNotVisible: ".*PIT OF DOOM.*"
