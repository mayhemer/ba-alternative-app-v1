# B5 · A day left scrolled to its end under All sets is drawn whole under
# Must-see only.
#
# Wednesday's position, saved at the end of its long All sets list, is past the
# end of its short Must-see only list. A list started there drew only the end
# cap, the rest of the screen blank until touched; it now lands at its end.
# Native only: the native list starting at a restored offset.
#
# On the real clock (common/relaunch.yaml passes no e2eNow): Wednesday is not
# today, so My plan starts it where the user left it rather than at now. The
# seed's eight Wednesday Must-sees, two in the afternoon and six after
# midnight, make the Must-see only list taller than the screen (the bug needs a
# list that scrolls), yet far shorter than the All sets one.
appId: cz.janbambas.ba
---
- runFlow: common/relaunch.yaml
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "My plan.*" }
# Wednesday under All sets, scrolled to its end: the user's scroll is saved.
- tapOn: "WED.*"
- tapOn: "Filters"
- tapOn: "All sets"
- scrollUntilVisible:
    element: { id: "plan-rail-end" }
    direction: DOWN
    timeout: 120000
- waitForAnimationToEnd
# Another day, the filter narrowed there, then back to Wednesday.
- tapOn: "THU.*"
- tapOn: "Filters"
- tapOn: "Must-see only"
- tapOn: "WED.*"
# No scroll or tap in between: the list lands at its end, drawn there, the
# last sets with it (unfixed, only the end cap was drawn).
- assertVisible: ".*HERIOT.*"
- assertVisible: ".*COMPUTERBOY.*"
- assertVisible: { id: "plan-rail-end" }
