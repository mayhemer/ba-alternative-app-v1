# Opens ${QUERY}'s artist sheet through search: the lens chip, the search field
# at the top of its panel, the query, then the best result. The sheet opens over
# the results, which stay (docs/frontend/design/search.md). Call it with no
# sheet open: an open sheet's backdrop takes the tap meant for the chip.
#
# A result's label is the name, then the day and time, then the stage
# ("CRYSTAL LAKE, Wed 14:00–14:40, Sea Shepherd"), and Maestro matches the
# whole label, so "${QUERY}, .*" is the band and never its meet & greet
# ("M&G - CRYSTAL LAKE, …"). Return closes the keyboard first.
#
# On a freshly booted simulator the tap sometimes did not focus the field yet,
# and the typed text went nowhere. So when the result is not there after the
# first try, the typing is retried, each time from an erased field in case part
# of the query got in. The field opens empty, so the first try erases nothing:
# erasing is a keystroke per character, ~2 s for 30, and is only paid on a retry.
appId: cz.janbambas.ba
---
- tapOn: "View and share schedules"
- tapOn: { id: "search-entry" }
- tapOn: { id: "search-input" }
- inputText: ${QUERY}
- pressKey: Enter
- runFlow:
    when:
      notVisible: "${QUERY}, .*"
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn: { id: "search-input" }
            - eraseText: 30
            - inputText: ${QUERY}
            - pressKey: Enter
            - assertVisible: "${QUERY}, .*"
- tapOn: "${QUERY}, .*"
- waitForAnimationToEnd
