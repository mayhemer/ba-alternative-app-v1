# Cleared app → the "returning-user" seed's picks stored (tests/fixtures/e2e/seeds.json) →
# the clock standing at Wednesday 6 August 2025, 14:10 (src/instrumentation/timeMode.ts) →
# fixture data loaded → artist list on screen.
#
# At 14:10 CRYSTAL LAKE (14:00–14:40) is live and EXORCIZPHOBIA (14:30–15:05),
# which clashes with it, comes next: My plan opens on Wednesday at now, and the
# now pill names CRYSTAL LAKE. The seed's Must-sees clash in three groups,
# seven sets in all (tests/fixtures/e2e/seeds.json lists them).
appId: cz.janbambas.ba
---
- runScript: api-online.js
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      e2eSeed: "returning-user"
      e2eNow: "2025-08-06T14:10:00+02:00"
- extendedWaitUntil:
    visible: ".*3 INCHES OF BLOOD.*"
    timeout: 30000
