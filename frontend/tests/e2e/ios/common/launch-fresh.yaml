# Cleared app → fixture data loaded → artist list on screen.
# The e2e build defaults to ba2025 (EXPO_PUBLIC_DEFAULT_SLUG), whose first
# playable artist in the list's collated order is 3 INCHES OF BLOOD.
#
# In English, whatever the simulator's or the Mac's language: the flows read
# English text. -AppleLanguages is the app's preferred-language list for this
# launch alone, as iOS's per-app language setting would set it; it leaves the
# simulator as it is. Every launch passes it (common/relaunch.yaml too), except
# language-*.yaml, which pass Czech on purpose.
appId: cz.janbambas.ba
---
# Restore the API first: if an earlier flow failed while it had taken the API
# offline, every later flow would otherwise fail for a reason that isn't its own.
- runScript: api-online.js
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
- extendedWaitUntil:
    visible: ".*3 INCHES OF BLOOD.*"
    timeout: 30000
