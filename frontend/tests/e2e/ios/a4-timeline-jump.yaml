# A4 · Going to a set from the artist sheet scrolls the timeline to it.
#
# Native only: the day switch, then the native scroller's scrollTo, centring
# the set and its lane. Web covers the geometry precisely
# (tests/e2e/web/timeline.spec.ts); this proves the native scroller lands too.
#
# REPLICANT plays once, Friday 22:30, in the Octagon — the bottom lane — so the
# jump needs a day switch, a long horizontal move and a vertical one.
appId: cz.janbambas.ba
---
- runFlow: common/relaunch.yaml
- runFlow:
    file: common/open-section.yaml
    env: { SECTION: "Artists" }
- runFlow:
    file: common/search-artist.yaml
    env: { QUERY: "replicant" }
# The sheet's event row: stage, day and time merged into one label, the stage
# first. The search result behind carries the same time after the name, so the
# stage at the start is what tells them apart. The tap navigates, which closes
# the search.
- tapOn: "Octagon.*22:30–23:30.*"
- waitForAnimationToEnd
# The block's label is the name followed by its time; the list row's is the
# name followed by genre and country, so this cannot match the list behind.
- extendedWaitUntil:
    visible: "REPLICANT.*22:30.*"
    timeout: 10000
# Visibility here means on screen, not merely mounted: an earlier set in the
# same lane, ~3 h to the left, must be off it. Without this the assertion above
# would pass on any day the block exists.
- assertNotVisible: ".*FIVE THE HIEROPHANT.*"
